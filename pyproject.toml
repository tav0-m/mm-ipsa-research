[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mm-ipsa-research"
version = "0.5.0"
description = "Independent research platform for moment-matching scenario generation and portfolio evaluation"
readme = "README.md"
requires-python = ">=3.11,<3.13"
authors = [
  {name = "Gustavo Chuquiviguel"},
]
license = "MIT"
license-files = ["LICENSE"]
keywords = ["scenario-generation", "portfolio", "time-series", "forecast-evaluation"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
  "numpy>=1.26,<2",
  "pandas>=2.2,<3",
  "scipy>=1.12,<2",
  "matplotlib>=3.8,<4",
  "PyYAML>=6,<7",
  "yfinance>=1.3,<2",
]

[project.optional-dependencies]
dev = [
  "build>=1.2,<2",
  "pandas-stubs==2.2.2.240603",
  "pyright[nodejs]>=1.1.411,<2",
  "ruff>=0.12,<1",
]

[project.scripts]
mm-ipsa = "mm_ipsa.cli:main"

[project.urls]
Homepage = "https://tav0-m.github.io/mm-ipsa-research/"
Repository = "https://github.com/tav0-m/mm-ipsa-research"
Documentation = "https://github.com/tav0-m/mm-ipsa-research/tree/main/research"
Issues = "https://github.com/tav0-m/mm-ipsa-research/issues"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["mm_ipsa*"]

[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "basic"

[tool.coverage.run]
branch = true
source = ["mm_ipsa"]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["local_legacy"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
