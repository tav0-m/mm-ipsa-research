[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mm-ipsa-research"
version = "0.4.0"
description = "Independent research platform for moment-matching scenario generation and portfolio evaluation"
readme = "README.md"
requires-python = ">=3.11"
authors = [
  {name = "Gustavo Chuquiviguel"},
]
license = {file = "LICENSE"}
keywords = ["scenario-generation", "portfolio", "time-series", "forecast-evaluation"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
  "numpy>=1.26,<2",
  "pandas>=2.2,<3",
  "scipy>=1.12,<2",
  "matplotlib>=3.8,<4",
  "seaborn>=0.13,<1",
  "PyYAML>=6,<7",
  "yfinance>=1.3,<2",
  "requests>=2.31,<3",
]

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "basic"

[tool.coverage.run]
branch = true
source = ["src"]
