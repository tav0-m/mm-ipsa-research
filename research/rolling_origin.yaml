experiment:
  id: rolling_origin_expanding_v1
  status: development_validation
  window_type: expanding
  primary_universe: full_15_assets

folds:
  - fold_id: "2023"
    train_end: "2022-12-30"
    evaluation_start: "2023-01-03"
    evaluation_end: "2023-12-29"
  - fold_id: "2024"
    train_end: "2023-12-29"
    evaluation_start: "2024-01-02"
    evaluation_end: "2024-12-30"
  - fold_id: "2025"
    train_end: "2024-12-30"
    evaluation_start: "2025-01-02"
    evaluation_end: "2025-12-30"
  - fold_id: "2026H1"
    train_end: "2025-12-30"
    evaluation_start: "2026-01-02"
    evaluation_end: "2026-06-10"

validation:
  minimum_training_daily_rows: 500
  minimum_evaluation_terminal_rows: 20
  require_disjoint_evaluation_windows: true
  refit_all_models_each_fold: true

inference:
  # block_size es el respaldo; el ancho efectivo lo fija Politis-White sobre
  # las autocovarianzas agrupadas dentro de folds y queda registrado por
  # contraste en probabilistic_score_differences_pooled.csv.
  block_size: 4
  block_size_mode: auto
  bootstrap_samples: 5000
  confidence_level: 0.95
  multiple_testing: holm
